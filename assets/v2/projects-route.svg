<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="120" viewBox="0 0 1100 120" role="img" aria-label="Featured projects section">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#6E5CFF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="24" y="72" fill="url(#g)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="25" font-weight="700">03 / FEATURED PROJECTS</text>

  <!-- two quiet guide waves -->
  <path d="M368 75 C400 60 425 49 452 48 C500 47 550 95 609 91 C665 87 728 47 790 47 C845 47 888 89 946 83 C980 79 1010 70 1043 64"
        fill="none" stroke="#30363D" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M368 83 C400 68 425 57 452 56 C500 55 550 103 609 99 C665 95 728 55 790 55 C845 55 888 97 946 91 C980 87 1010 78 1043 72"
        fill="none" stroke="#21262D" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>

  <!-- moving blue-purple highlight -->
  <path d="M368 75 C400 60 425 49 452 48 C500 47 550 95 609 91 C665 87 728 47 790 47 C845 47 888 89 946 83 C980 79 1010 70 1043 64"
        pathLength="800"
        fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="86 714" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- permanent project nodes -->
  <g fill="#0D1117" stroke-width="2.2">
    <circle cx="452" cy="48" r="8" stroke="#58A6FF"/>
    <circle cx="609" cy="91" r="8" stroke="#6E5CFF"/>
    <circle cx="790" cy="47" r="8" stroke="#7C3AED"/>
    <circle cx="946" cy="83" r="8" stroke="#A371F7"/>
  </g>
  <g>
    <circle cx="452" cy="48" r="2.5" fill="#58A6FF"/>
    <circle cx="609" cy="91" r="2.5" fill="#6E5CFF"/>
    <circle cx="790" cy="47" r="2.5" fill="#7C3AED"/>
    <circle cx="946" cy="83" r="2.5" fill="#A371F7"/>
  </g>
</svg>