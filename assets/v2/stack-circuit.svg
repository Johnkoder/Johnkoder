<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="108" viewBox="0 0 1100 108" role="img" aria-label="Languages and tools section">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset=".52" stop-color="#6E5CFF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="22" y="63" fill="url(#g)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700">02 / STACK</text>

  <!-- one continuous circuit path -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 54H365L405 28H550L585 54H732L770 82H914L948 54H1060" stroke="#30363D" stroke-width="2"/>
    <path d="M210 54H365L405 28H550L585 54H732L770 82H914L948 54H1060" stroke="url(#g)" stroke-width="2.5" stroke-dasharray="92 790">
      <animate attributeName="stroke-dashoffset" from="882" to="0" dur="5.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- nodes sit directly on the path -->
  <g fill="#0D1117" stroke-width="2">
    <circle cx="365" cy="54" r="7" stroke="#58A6FF"/>
    <circle cx="405" cy="28" r="7" stroke="#6E5CFF"/>
    <circle cx="585" cy="54" r="7" stroke="#7C3AED"/>
    <circle cx="770" cy="82" r="7" stroke="#A371F7"/>
    <circle cx="914" cy="82" r="7" stroke="#58A6FF"/>
    <circle cx="948" cy="54" r="7" stroke="#7C3AED"/>
  </g>

  <!-- restrained endpoint, still part of the same line -->
  <g filter="url(#glow)">
    <circle cx="1060" cy="54" r="5" fill="#A371F7"/>
    <circle cx="1060" cy="54" r="10" fill="none" stroke="#A371F7" stroke-width="1.4" opacity="0.35">
      <animate attributeName="r" values="8;13;8" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;.08;.45" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>