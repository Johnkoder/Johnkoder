<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="108" viewBox="0 0 1100 108" role="img" aria-label="Languages and tools section">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset=".45" stop-color="#6E5CFF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <text x="22" y="63" fill="url(#g)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700">02 / STACK</text>

  <!-- Static circuit, matching the Selected Work base-line treatment -->
  <g fill="none" stroke="#30363D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 54H365L405 28H550L585 54H732L770 82H914L948 54H1000"/>
    <path d="M1000 54H1018L1040 36H1064"/>
    <path d="M1000 54H1018L1040 72H1064"/>
  </g>

  <!--
    Same motion language as Selected Work:
    - 3px blue/purple gradient stroke
    - 80/720 moving segment
    - 800 -> 0 dash offset
    - 6 second continuous loop

    These two routes are identical until x=1000, so their moving segments overlap
    as one line and naturally split into two only when the pulse reaches the fork.
  -->
  <g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".58">
    <path d="M210 54H365L405 28H550L585 54H732L770 82H914L948 54H1000H1018L1040 36H1064"
          pathLength="800"
          stroke-dasharray="80 720">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="6s" repeatCount="indefinite"/>
    </path>

    <path d="M210 54H365L405 28H550L585 54H732L770 82H914L948 54H1000H1018L1040 72H1064"
          pathLength="800"
          stroke-dasharray="80 720">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Nodes remain permanently visible -->
  <g fill="#0D1117" stroke-width="2.5">
    <circle cx="365" cy="54" r="7" stroke="#58A6FF"/>
    <circle cx="405" cy="28" r="7" stroke="#6E5CFF"/>
    <circle cx="585" cy="54" r="7" stroke="#7C3AED"/>
    <circle cx="770" cy="82" r="7" stroke="#A371F7"/>
    <circle cx="914" cy="82" r="7" stroke="#58A6FF"/>
    <circle cx="948" cy="54" r="7" stroke="#7C3AED"/>
    <circle cx="1000" cy="54" r="6" stroke="#6E5CFF"/>
    <circle cx="1064" cy="36" r="5" stroke="#58A6FF"/>
    <circle cx="1064" cy="72" r="5" stroke="#A371F7"/>
  </g>
</svg>
